schema_version: '4.0'
package_id: pkg_bob
node_id: node_bob
node_role: measurement_node
layout:
  lane: right
  order: 2
  endpoint_side: bob
provides:
- kx1_bob
- secret_key_out
requires:
- qch_source_bob
- sync_source_bob
- cch_alice_bob
- protocol:bbm92
- alice_timestamps_out
boundary_ports:
  secret_key_out:
    owner_id: bob_key_store
    interface_type: boundary
    direction: out
    signal_type: secret_key
    boundary: true
  kx1_bob_relay:
    owner_id: bob_kma
    interface_type: boundary
    direction: inout
    edge_kind: digital
    signal_type: kx1_key_relay
    boundary: true
    comment: Trusted-node key relay (Bob KMS) to peer node
    connector:
      position: left
      size: small
      #style: color
      #color: '#fb7185'
# Intra-node links: both endpoints live inside this node, so the channel
# physics and port wiring are authored here (self-contained), not in the
# network channel file. Endpoints reference device boundary ports by name.
channels:
  cch_bob_relay:
    component_class: classical_network_link
    edge_kind: digital
    bidirectional: true
    bandwidth_mbps: 1000
    one_way_latency_ms: 0.05

node:
  node_id: node_bob
  name: Bob Measurement Node
  node_role: measurement_node
  device_ids:
  - device_bob_01
