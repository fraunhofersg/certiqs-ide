schema_version: '3.1'
timing:
  time_model:
    base_unit: ps
    resolution_ps: 1
  clock_domains:
  - clock_domain_id: alice_tdc_clk
    frequency_hz: 200000000
    offset_ppm: 0.1
  - clock_domain_id: bob_tdc_clk
    frequency_hz: 200000000
    offset_ppm: -0.15
  synchronization:
    method: two_way_time_transfer
    update_period_ms: 10
    residual_offset_ps_rms: 40
  coincidence_processor:
    # The central entangled-photon source distributes pairs only; coincidence
    # correlation and key sifting run on the measurement nodes (Alice here).
    execution_location: subdomain_alice_coincidence_correlation
    authoritative_host: alice
    peer_nodes:
    - bob
    window_ps: 500
    queue_depth: 8192
    overflow_policy: drop_and_count
qkdn_controller:
  control_loops:
  - control_id: timing_alignment
    observed_metric: coincidence_histogram_peak
    actuators:
    - alice_tdc
    - bob_tdc
    algorithm: peak_tracking
    update_interval_s: 5
  calibration_policy:
    require_valid_records_for_physical_instance: true
    maximum_age_days: 365
