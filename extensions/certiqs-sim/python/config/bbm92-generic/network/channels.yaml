# Cross-node quantum / classical / sync channels.
# Fibre entries carry installed geometry plus an optional `link_budget` block for
# design margin, ageing, contamination, bending, and measurement uncertainty
# (see docs/configuration.md). Enable impairment flags only when modelling those
# effects; with `enabled: false` the mean channel η is unchanged.
schema_version: '3.1'
channels:
  qch_source_alice:
    component_class: single_mode_fiber_channel
    model_binding_id: channels.fiber.dynamic_jones.v2
    length_km: 10.0
    attenuation_db_per_km: 0.2
    wavelength_nm: 1550.0
    num_connectors: 2
    connector_loss_db: 0.2
    num_splices: 2
    splice_loss_db: 0.05
    group_index: 1.4682
    chromatic_dispersion_ps_nm_km: 17.0
    pmd_ps_sqrt_km: 0.08
    pdl_db: 0.05
    polarization_drift_deg_rms_per_sqrt_s: 0.4
    background_count_equivalent_hz: 80
    link_budget:
      design_margin_db: 1.0
      apply_design_margin: false
      ageing:
        enabled: false
        excess_loss_db: 0.0
        rate_db_per_year: 0.02
        service_life_years: 0.0
      contamination:
        enabled: false
        excess_loss_db: 0.0
        connector_contamination_prob: 0.05
      bending:
        enabled: false
        excess_loss_db: 0.0
        min_bend_radius_mm: 30.0
        induced_loss_db_per_turn: 0.1
        num_tight_bends: 0
      measurement_uncertainty:
        attenuation_db_per_km_sigma: 0.01
        length_km_sigma: 0.05
        splice_loss_db_sigma: 0.02
        connector_loss_db_sigma: 0.05
        loss_budget_confidence: 0.95
  qch_source_bob:
    component_class: single_mode_fiber_channel
    model_binding_id: channels.fiber.dynamic_jones.v2
    length_km: 12.0
    attenuation_db_per_km: 0.2
    wavelength_nm: 1550.0
    num_connectors: 2
    connector_loss_db: 0.225
    num_splices: 2
    splice_loss_db: 0.05
    group_index: 1.4682
    chromatic_dispersion_ps_nm_km: 17.0
    pmd_ps_sqrt_km: 0.08
    pdl_db: 0.05
    polarization_drift_deg_rms_per_sqrt_s: 0.5
    background_count_equivalent_hz: 90
    link_budget:
      design_margin_db: 1.0
      apply_design_margin: false
      ageing:
        enabled: false
        excess_loss_db: 0.0
        rate_db_per_year: 0.02
        service_life_years: 0.0
      contamination:
        enabled: false
        excess_loss_db: 0.0
        connector_contamination_prob: 0.05
      bending:
        enabled: false
        excess_loss_db: 0.0
        min_bend_radius_mm: 30.0
        induced_loss_db_per_turn: 0.1
        num_tight_bends: 0
      measurement_uncertainty:
        attenuation_db_per_km_sigma: 0.01
        length_km_sigma: 0.05
        splice_loss_db_sigma: 0.02
        connector_loss_db_sigma: 0.05
        loss_budget_confidence: 0.95
  cch_alice_bob:
    component_class: classical_network_link
    bandwidth_mbps: 1000
    one_way_latency_ms: 0.8
    packet_loss_probability: 1.0e-06
    jitter_ms_rms: 0.05
    transport: tcp_tls_placeholder
  sync_source_alice:
    component_class: time_sync_channel
    one_way_latency_ns: 60000
    latency_jitter_ps_rms: 100
    asymmetry_ps: 40
  sync_source_bob:
    component_class: time_sync_channel
    one_way_latency_ns: 60000
    latency_jitter_ps_rms: 100
    asymmetry_ps: 40
connections:
- from: central_entanglement_source.alice_out
  via: qch_source_alice
  to: alice_station.quantum_in
- from: central_entanglement_source.bob_out
  via: qch_source_bob
  to: bob_station.quantum_in
bindings:
- channel_id: qch_source_alice
  from_port: source_out_alice
  to_port: alice_pam_in
  from_package: pkg_source
  to_package: pkg_alice
- channel_id: qch_source_bob
  from_port: source_out_bob
  to_port: bob_pam_in
  from_package: pkg_source
  to_package: pkg_bob
- channel_id: cch_alice_bob
  from_port: kx1_alice
  to_port: kx1_bob
  from_package: pkg_alice
  to_package: pkg_bob
- channel_id: sync_source_alice
  from_port: sync_out
  to_port: sync_in
  from_package: network
  to_package: pkg_alice
- channel_id: sync_source_bob
  from_port: sync_out
  to_port: sync_in
  from_package: network
  to_package: pkg_bob
