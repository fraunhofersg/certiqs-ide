schema_version: '2.0'
component_catalog:
  description: 'Optional mapping from logical simulation components to commercial
    product models, laboratory assets, or uniquely identifiable hardware devices.
    All example vendor, model, serial, calibration, and asset values below are illustrative
    placeholders. Replace them with verified inventory records before laboratory use.

    '
  identity_policy:
    mapping_optional: true
    allow_generic_model_only: true
    allow_physical_instance_binding: true
    allow_multiple_candidate_models: true
    require_verified_identity_for_hardware_in_loop: true
    require_calibration_reference_for_measurement_models: true
    reject_duplicate_device_uuid: true
    sensitive_fields:
    - serial_number
    - asset_tag
    - network_address
    - physical_location
  field_semantics:
    logical_component_id: Stable identifier used by the simulation configuration.
    model_binding_id: Identifier of a generic physical or software model in the model
      registry.
    product_identity: Optional manufacturer and commercial product-model information.
    device_identity: Optional unique identity of one physical hardware instance.
    software_identity: Optional firmware, driver, FPGA image, or software package
      identity.
    metrology_identity: Calibration, measurement, and uncertainty evidence for this
      instance.
    lifecycle_identity: Ownership, location, service status, and maintenance information.
    digital_twin_identity: Link between the physical asset and its calibrated simulation
      model.
  components:
